name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支连着推两次，前一次直接取消，省得两个构建抢着往同一个 release 上传
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # 版本号只在 csproj 里维护一份，这里读出来给 release 用
      - name: Read version
        id: ver
        shell: pwsh
        run: |
          [xml]$proj = Get-Content Bloxstrap/Bloxstrap.csproj
          $v = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          Write-Host "version = $v"
          "version=$v" >> $env:GITHUB_OUTPUT

      - run: dotnet restore Bloxstrap.sln

      # ── 四个版本 ───────────────────────────────────────────────────────
      # full            自包含，单文件，不压缩   免装运行时，启动最快，体积最大
      # full-compressed 自包含，单文件，压缩     默认版本，体积和启动折中
      # lite            框架依赖，单文件，不压缩  需要 .NET 10 桌面运行时
      # lite-folder     框架依赖，多文件          需要运行时，解压后是文件夹
      #
      # 为什么没有「框架依赖 + 单文件 + 压缩」：.NET SDK 直接拒绝，
      # 报 "Compression in a single file bundle is only supported when
      # publishing a self-contained application"。框架依赖想减小体积，
      # 只能退回多文件，让 zip 去压 —— 效果一样，解压后多几个 dll
      #
      # EnableCompressionInSingleFile 只在 PublishSingleFile=true 时生效，
      # 所以单文件版本都要显式带上这两个属性，不靠 csproj 里的默认值

      - name: Publish full
        run: >
          dotnet publish Bloxstrap/Bloxstrap.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=false
          -p:CommitHash=${{ github.sha }}
          -p:CommitRef=${{ github.ref_type }}/${{ github.ref_name }}
          -p:DebugType=None -p:DebugSymbols=false
          -o publish/full

      - name: Publish lite
        run: >
          dotnet publish Bloxstrap/Bloxstrap.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=false
          -p:CommitHash=${{ github.sha }}
          -p:CommitRef=${{ github.ref_type }}/${{ github.ref_name }}
          -p:DebugType=None -p:DebugSymbols=false
          -o publish/lite

      - name: Publish full-compressed
        run: >
          dotnet publish Bloxstrap/Bloxstrap.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:CommitHash=${{ github.sha }}
          -p:CommitRef=${{ github.ref_type }}/${{ github.ref_name }}
          -p:DebugType=None -p:DebugSymbols=false
          -o publish/full-compressed

      - name: Publish lite-folder
        run: >
          dotnet publish Bloxstrap/Bloxstrap.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=false
          -p:CommitHash=${{ github.sha }}
          -p:CommitRef=${{ github.ref_type }}/${{ github.ref_name }}
          -p:DebugType=None -p:DebugSymbols=false
          -o publish/lite-folder

      # 每个版本体积区间不同。超出区间基本就是 publish 参数没生效：
      # 比如 lite 变成 160MB 说明 --self-contained false 被忽略，
      # full 掉到 60MB 说明压缩开关没关掉。
      # 单文件版本量 exe，多文件版本量整个目录
      - name: Verify output
        shell: pwsh
        run: |
          $expect = [ordered]@{
            'full'            = @{ Min = 140; Max = 220; Single = $true }
            'lite'            = @{ Min = 10;  Max = 60;  Single = $true }
            'full-compressed' = @{ Min = 60;  Max = 110; Single = $true }
            'lite-folder'     = @{ Min = 8;   Max = 40;  Single = $false }
          }

          foreach ($name in $expect.Keys) {
            $rule = $expect[$name]
            $dir = "publish/$name"
            $exe = Get-Item "$dir/Luckstrap.exe" -ErrorAction SilentlyContinue

            if (-not $exe) { throw "$dir 里没有 Luckstrap.exe" }

            if ($rule.Single) {
              $size = $exe.Length
              $label = 'Luckstrap.exe'
            } else {
              $size = (Get-ChildItem $dir -Recurse -File | Measure-Object Length -Sum).Sum
              $label = '整个目录'
            }

            $mb = [math]::Round($size / 1MB, 1)

            Write-Host ("{0,-16} {1,-14} {2,7} MB  预期 {3}-{4} MB" -f $name, $label, $mb, $rule.Min, $rule.Max)

            if ($mb -lt $rule.Min -or $mb -gt $rule.Max) {
              throw "$dir 体积异常：$mb MB，检查 self-contained 和压缩参数是否生效"
            }

            if ($rule.Single) {
              $extra = Get-ChildItem $dir -File | Where-Object { $_.Name -ne 'Luckstrap.exe' }
              if ($extra) {
                Write-Host "  $dir 里还有："
                $extra | ForEach-Object { Write-Host ("    {0}  {1:N0} 字节" -f $_.Name, $_.Length) }
              }
            }
          }

      # 交付形态：两个裸 exe + 两个压缩包
      #   Luckstrap-full.exe              不压缩，自包含，免装运行时
      #   Luckstrap-lite.exe              不压缩，框架依赖，需 .NET 10 桌面运行时
      #   ...-full-compressed.zip         压缩，自包含
      #   ...-lite-compressed.zip         压缩，框架依赖（多文件，由 zip 提供压缩）
      - name: Package
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"

          Copy-Item 'publish/full/Luckstrap.exe' 'Luckstrap-full.exe' -Force
          Copy-Item 'publish/lite/Luckstrap.exe' 'Luckstrap-lite.exe' -Force

          $fullZip = "Luckstrap-v$v-win-x64-full-compressed.zip"
          $liteZip = "Luckstrap-v$v-win-x64-lite-compressed.zip"

          Compress-Archive -Path 'publish/full-compressed/Luckstrap.exe' -DestinationPath $fullZip -Force

          # 框架依赖版做不成压缩单文件（SDK 直接拒绝），退回多文件，
          # 压缩交给 zip。解压出来是 exe 加一堆 dll，双击 exe 就能用
          Compress-Archive -Path 'publish/lite-folder/*' -DestinationPath $liteZip -Force

          Get-ChildItem 'Luckstrap-*' | ForEach-Object {
            Write-Host ("{0}  {1:N0} 字节" -f $_.Name, $_.Length)
          }

      - uses: actions/upload-artifact@v7
        with:
          name: Luckstrap-win-x64
          path: |
            Luckstrap-full.exe
            Luckstrap-lite.exe
            Luckstrap-v*-win-x64-*.zip
          if-no-files-found: error

      # 客户端检查更新打的是 releases/latest，所以仓库里必须真的有 release
      - name: Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo = "${{ github.repository }}"
          $tag = "v${{ steps.ver.outputs.version }}"

          # 自更新代码里硬编码了 releases/download/<tag>/Luckstrap.exe，
          # 这个裸文件必须一直存在，否则老客户端检查更新会 404。
          # 内容用压缩+自包含那份：免装运行时，体积也还能接受
          $default = (Resolve-Path 'publish/full-compressed/Luckstrap.exe').Path
          $bare = @(
            (Resolve-Path 'Luckstrap-full.exe').Path
            (Resolve-Path 'Luckstrap-lite.exe').Path
          )
          $zips = Get-ChildItem 'Luckstrap-v*-win-x64-*.zip' | ForEach-Object { $_.FullName }
          $files = @($default) + $bare + $zips

          $null = gh release view $tag --repo $repo 2>&1
          if ($LASTEXITCODE -eq 0) {
            # 以前构建留下的旧名字产物不会被 --clobber 覆盖，会一直堆在 release 页上
            $expected = @('Luckstrap.exe', 'Luckstrap-full.exe', 'Luckstrap-lite.exe') +
                        ($zips | ForEach-Object { Split-Path $_ -Leaf })
            $existing = gh release view $tag --repo $repo --json assets -q '.assets[].name' 2>$null

            foreach ($a in $existing) {
              if ($a -like 'Luckstrap*' -and $a -notin $expected) {
                Write-Host "删除过期产物 $a"
                gh release delete-asset $tag $a --repo $repo --yes
              }
            }

            Write-Host "Release $tag 已存在，覆盖全部产物"
            gh release upload $tag $files --clobber --repo $repo
            gh release edit $tag --repo $repo --notes-file RELEASE_NOTES.md
          } else {
            Write-Host "创建 release $tag"
            gh release create $tag $files `
              --repo $repo `
              --title "Luckstrap $tag" `
              --notes-file RELEASE_NOTES.md `
              --latest
          }
