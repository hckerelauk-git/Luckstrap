name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支连着推两次，前一次直接取消，省得两个构建抢着往同一个 release 上传
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      # 版本号只在 csproj 里维护一份，这里读出来给 release 用
      - name: Read version
        id: ver
        shell: pwsh
        run: |
          [xml]$proj = Get-Content Bloxstrap/Bloxstrap.csproj
          $v = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          Write-Host "version = $v"
          "version=$v" >> $env:GITHUB_OUTPUT

      - run: dotnet restore Bloxstrap.sln

      - name: Publish
        run: >
          dotnet publish Bloxstrap/Bloxstrap.csproj
          -c Release -r win-x64 --self-contained true
          -p:CommitHash=${{ github.sha }}
          -p:CommitRef=${{ github.ref_type }}/${{ github.ref_name }}
          -p:DebugType=None -p:DebugSymbols=false
          -o publish

      # 单文件压缩开着是 73MB 上下，关掉是 166MB。
      # 体积掉到 50MB 以下说明 publish 出了别的问题，别把坏包发出去
      - name: Verify output
        shell: pwsh
        run: |
          $exe = Get-Item publish/Luckstrap.exe -ErrorAction SilentlyContinue
          if (-not $exe) { throw "publish 目录里没有 Luckstrap.exe" }

          $mb = [math]::Round($exe.Length / 1MB, 1)
          Write-Host "Luckstrap.exe = $mb MB"
          if ($mb -lt 50 -or $mb -gt 120) {
            throw "exe 体积异常：$mb MB，检查 EnableCompressionInSingleFile 是否被改动"
          }

          $extra = Get-ChildItem publish -File | Where-Object { $_.Name -ne 'Luckstrap.exe' }
          if ($extra) {
            Write-Host "publish 目录里还有："
            $extra | ForEach-Object { Write-Host ("  {0}  {1:N0} 字节" -f $_.Name, $_.Length) }
          }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/Luckstrap.exe -DestinationPath Luckstrap-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Luckstrap-win-x64
          path: |
            publish/Luckstrap.exe
            Luckstrap-win-x64.zip
          if-no-files-found: error

      # 客户端检查更新打的是 releases/latest，所以仓库里必须真的有 release
      - name: Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo = "${{ github.repository }}"
          $tag = "v${{ steps.ver.outputs.version }}"
          $exe = (Resolve-Path publish/Luckstrap.exe).Path
          $zip = (Resolve-Path Luckstrap-win-x64.zip).Path

          $null = gh release view $tag --repo $repo 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag 已存在，覆盖 exe 与 zip"
            gh release upload $tag $exe $zip --clobber --repo $repo
            gh release edit $tag --repo $repo --notes-file RELEASE_NOTES.md
          } else {
            Write-Host "创建 release $tag"
            gh release create $tag $exe $zip `
              --repo $repo `
              --title "Luckstrap $tag" `
              --notes-file RELEASE_NOTES.md `
              --latest
          }
